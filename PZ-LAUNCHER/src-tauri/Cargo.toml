[package]
name = "apocalipto-pz-launcher"
version = "1.3.5"
description = "Launcher Oficial de Apocalipto PZ - Red P2P Descentralizada Build 42"
authors = ["Apocalipto PZ Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-hide", "window-close", "window-minimize", "window-maximize", "window-show", "window-unmaximize", "shell-open", "window-start-dragging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.21"

[features]
custom-protocol = ["tauri/custom-protocol"]
